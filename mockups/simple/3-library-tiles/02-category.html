<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vitrine: All assets</title>
<link rel="stylesheet" href="style.css">
<style>
  .title { display: flex; align-items: center; gap: 14px; }
  .title h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .title span { color: var(--text2); font-size: 17px; margin-left: -6px; font-variant-numeric: tabular-nums; }
  .search { width: 380px; }
  .pill { height: 40px; padding: 0 18px; border-radius: 20px; background: rgba(255, 255, 255, .065); font-weight: 550; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; padding: 4px 40px 40px; }
  .cell { position: relative; aspect-ratio: 1; background: var(--tile); border-radius: 18px; overflow: hidden; }
  .cell > i { position: absolute; inset: 0; }
  .gen { display: grid; place-items: center; color: var(--text3); font-size: 13px; }
  .gen::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.035) 50%, transparent 70%); }
  .tag { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 550; padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.45); color: var(--text2); }
  /* The one hovered cell: hover-only accelerators (select circle, favorite, name). */
  .hover { background: var(--cell-hi); box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 12px 30px rgba(0,0,0,.35); }
  .hover .chk { position: absolute; left: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid rgba(255,255,255,.75); background: rgba(0,0,0,.25); }
  .hover .fav { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.3); }
  .hover .fav svg { width: 17px; height: 17px; fill: var(--text); stroke: none; }
  .hover .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; font-size: 13px; font-weight: 550; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
</style>
</head>
<body>
<header class="bar">
  <div class="title">
    <button class="round" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <h1>All assets</h1><span>77</span>
  </div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search all assets</span><kbd>/</kbd></div>
  <div class="end">
    <button class="pill">Select</button>
    <button class="round" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>
<main class="grid" id="grid"></main>
<script src="../../shared/sample-data.js"></script>
<script src="../../shared/pixel-utils.js"></script>
<script src="bbox.js"></script>
<script src="art.js"></script>
<script>
const SHEET = ['tileset_topdown', 'tileset_sidescroller', 'tiles_pro', 'font', 'ui_asset'];
const fitFor = a => SHEET.includes(a.type) ? 'data-fit="full" data-pad="0.1"'
  : a.type === 'map' ? 'data-fit="cover" data-s="2"'
  : a.type === 'creator_image' && a.width >= 256 ? 'data-fit="cover" data-s="1"' : 'data-pad="0.16"';
const name = p => p.split('/').pop().replace('.png', '');
grid.innerHTML = SAMPLE_DATA.assets.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(a => {
  if (!a.thumb) return `<div class="cell gen">Generating…</div>`;
  const hover = a.id === 'img_0022';
  return `<div class="cell${hover ? ' hover' : ''}"><i data-art="${name(a.thumb)}" ${fitFor(a)}></i>${a.status === 'review' ? '<span class="tag">4 to review</span>' : ''}${hover ? `<span class="chk"></span><span class="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg></span><span class="cap">${a.name}</span>` : ''}</div>`;
}).join('');
renderArt();
</script>
</body>
</html>
